# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!**/*.lock"
    - "!**/Pods/**"
    - "!**/*.pbxproj"
    - "!**/project.xcworkspace/**"
    - "!**/xcuserdata/**"
    - "!**/xcshareddata/**"
    - "!**/.DS_Store"
    - "!**/Assets.xcassets/**"
    - "!**/Color.xcassets/**"
    - "!**/GoogleService-Info.plist"

  path_instructions:
    # ViewModel 리뷰 지침
    - path: "**/ViewModels/**/*.swift"
      instructions: |
        ViewModel 코드 리뷰 시 다음을 중점 확인:
        - @Observable 매크로 올바른 사용 여부
        - 상태 관리가 적절히 분리되어 있는지 (State 클래스 분리)
        - View와의 결합도가 낮은지
        - 비즈니스 로직이 Service 레이어로 적절히 위임되는지
        - async/await 사용 시 MainActor 처리 확인
        - 메모리 누수 가능성 ([weak self] 캡처 확인)

    # Service 레이어 리뷰 지침
    - path: "**/Service/**/*.swift"
      instructions: |
        Service 레이어 코드 리뷰 시 다음을 중점 확인:
        - Singleton 패턴 적절한 사용 여부
        - Firebase 호출 시 에러 핸들링 (FirestoreError, AuthenticationError 등)
        - 비동기 작업의 적절한 처리 (async/await, Task)
        - 캐싱 로직의 정합성 (CacheStore, ListDataCacheManager)
        - Firestore 트랜잭션/배치 작업 시 데이터 일관성

    # Firebase 관련 리뷰 지침
    - path: "**/Firebase*.swift"
      instructions: |
        Firebase 관련 코드 리뷰 시 다음을 중점 확인:
        - Auth 상태 리스너 메모리 관리
        - Firestore 리스너 해제 여부 (ListenerRegistration)
        - FCM 토큰 관리 및 갱신 로직
        - Storage 업로드/다운로드 에러 핸들링
        - WriteStrategy(create/update) 적절한 사용

    # Navigation 리뷰 지침
    - path: "**/Navigation/**/*.swift"
      instructions: |
        Navigation 코드 리뷰 시 다음을 중점 확인:
        - NavigationRouter 제네릭 타입 안전성
        - Route enum의 Hashable 준수
        - 중복 네비게이션 방지 로직
        - Deep link 처리 시 올바른 라우팅

    # View 리뷰 지침
    - path: "**/Views/**/*.swift"
      instructions: |
        SwiftUI View 코드 리뷰 시 다음을 중점 확인:
        - View는 UI 로직만 포함하는지 (비즈니스 로직은 ViewModel로)
        - 불필요한 @State 사용 여부
        - 과도한 body 복잡도 (서브뷰로 분리 필요성)
        - LazyVStack/LazyHStack 적절한 사용 (성능)
        - .task, .onAppear 중복 호출 방지

    # Model/DTO 리뷰 지침
    - path: "**/Models/**/*.swift"
      instructions: |
        Model/DTO 코드 리뷰 시 다음을 중점 확인:
        - EntityRepresentable 프로토콜 준수
        - Codable 구현 시 CodingKeys 정확성
        - Firestore 필드명과 프로퍼티명 매핑 일관성 (snake_case ↔ camelCase)
        - 옵셔널 처리 적절성 (서버 데이터 누락 대비)

    # Component 리뷰 지침
    - path: "**/Components/**/*.swift"
      instructions: |
        공통 컴포넌트 리뷰 시 다음을 중점 확인:
        - 재사용성 고려 여부
        - 하드코딩된 값 없이 파라미터화 되었는지
        - 접근성(Accessibility) 지원
        - Preview 제공 여부

    # Enum 리뷰 지침
    - path: "**/Enum/**/*.swift"
      instructions: |
        Enum 코드 리뷰 시 다음을 중점 확인:
        - 에러 타입(LocalizedError)의 적절한 메시지 제공
        - Raw value 일관성
        - CaseIterable 필요 시 준수 여부
        - Firestore CollectionType 매핑 정확성

    # 비디오 관련 리뷰 지침 (핵심 기능)
    - path: "**/Video**/*.swift"
      instructions: |
        비디오 관련 코드 리뷰 시 다음을 중점 확인 (핵심 기능):
        - AVPlayer 메모리 관리 (해제 시점)
        - 비디오 캐싱 로직 (VideoCacheManager)
        - 업로드/다운로드 진행률 추적
        - 백그라운드 전환 시 플레이어 상태 관리
        - 용량 큰 파일 처리 시 메모리 사용량

    # 피드백 관련 리뷰 지침 (핵심 기능)
    - path: "**/Feedback**/*.swift"
      instructions: |
        피드백 관련 코드 리뷰 시 다음을 중점 확인 (핵심 기능):
        - 피드백 CRUD 작업의 Firestore 동기화
        - 타임스탬프 기반 피드백 위치 정확성
        - Reply(답글) 서브컬렉션 처리
        - 실시간 업데이트 리스너 관리

    # 캐시 관련 리뷰 지침
    - path: "**/*Cache*.swift"
      instructions: |
        캐시 관련 코드 리뷰 시 다음을 중점 확인:
        - SwiftData @Model 정의 적절성
        - 캐시 만료/정리 로직 (24시간 규칙)
        - 디스크 용량 관리
        - 캐시 무효화 시점의 정확성

    # AppDelegate 리뷰 지침
    - path: "**/AppDelegate.swift"
      instructions: |
        AppDelegate 리뷰 시 다음을 중점 확인:
        - Firebase 초기화 순서
        - 푸시 알림 등록 및 권한 처리
        - Deep link/Universal link 핸들링
        - 백그라운드/포그라운드 전환 처리
        - pendingDeeplinkURL 관리

chat:
  auto_reply: true

