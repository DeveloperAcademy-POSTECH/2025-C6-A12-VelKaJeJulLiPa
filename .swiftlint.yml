# DanceMachine SwiftLint Configuration
# 프로젝트 분석 결과를 기반으로 설정된 규칙입니다.

# ============================================================================
# 포함/제외 경로
# ============================================================================
included:
  - DanceMachine

excluded:
  - DanceMachine.xcodeproj
  - Pods
  - Carthage
  - .build
  - DerivedData
  - "**/*.generated.swift"

# ============================================================================
# 비활성화된 규칙
# ============================================================================
disabled_rules:
  - trailing_comma               # 후행 쉼표 스타일은 팀 선호에 따라
  - opening_brace               # 중괄호 스타일 유연하게
  - multiple_closures_with_trailing_closure  # SwiftUI에서 자주 사용
  - trailing_whitespace # 오른쪽 공백 룰 비 비활성화
# ============================================================================
# 선택적 활성화 규칙 (opt-in)
# ============================================================================
opt_in_rules:
  # 코드 품질
  - empty_count                  # .count == 0 대신 .isEmpty 사용
  - empty_string                 # "" 대신 .isEmpty 사용
  - first_where                  # .filter { }.first 대신 .first(where:) 사용
  - last_where                   # .filter { }.last 대신 .last(where:) 사용
  - sorted_first_last            # sorted().first 대신 min() 사용
  - contains_over_first_not_nil  # .first(where:) != nil 대신 .contains(where:) 사용
  - flatmap_over_map_reduce      # map + reduce 대신 flatMap 사용

  # 안전성
  - force_unwrapping             # 강제 언래핑 경고
  - implicitly_unwrapped_optional # 암묵적 언래핑 옵셔널 경고
  - discouraged_optional_boolean # Bool? 사용 경고
  - discouraged_optional_collection # [T]? 대신 [T] 사용 권장

  # 가독성
  - modifier_order               # SwiftUI modifier 순서
  - multiline_arguments          # 여러 줄 인자 정렬
  - multiline_parameters         # 여러 줄 파라미터 정렬
  - vertical_whitespace_closing_braces # 닫는 괄호 전 빈 줄 금지
  - vertical_whitespace_opening_braces # 여는 괄호 후 빈 줄 금지

  # 네이밍
  - file_name                    # 파일명과 타입명 일치

  # 불필요한 코드
  - redundant_nil_coalescing    # ?? nil 제거
  - redundant_type_annotation   # 불필요한 타입 명시 제거
  - toggle_bool                  # !bool 대신 bool.toggle() 권장

  # MARK 주석
  - mark                         # MARK 형식 통일

  # 클로저
  - closure_body_length          # 클로저 길이 제한
  - closure_end_indentation      # 클로저 끝 들여쓰기

  # 기타
  - fatal_error_message          # fatalError에 메시지 필수
  - private_over_fileprivate    # fileprivate 대신 private 권장
  - yoda_condition               # if 1 == x 대신 if x == 1

